name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bundels bouwen en release maken
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Versies en changelog controleren
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $props = ([regex]::Match((Get-Content Directory.Build.props -Raw), '<VersionPrefix>([^<]+)</VersionPrefix>')).Groups[1].Value
          $manifest = ([regex]::Match((Get-Content deploy/NlcsLegenda.bundle/PackageContents.xml -Raw), 'AppVersion="([^"]+)"')).Groups[1].Value
          Write-Host "tag=$tag  props=$props  manifest=$manifest"
          if ($tag -ne $props) { throw "Tag $tag komt niet overeen met Directory.Build.props ($props)." }
          if ($tag -ne $manifest) { throw "Tag $tag komt niet overeen met het bundle-manifest ($manifest)." }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## $tag ")) { throw "Geen CHANGELOG-sectie voor $tag." }

      - name: Offline handleiding controleren
        shell: pwsh
        run: ./dev/scripts/Test-Help.ps1

      - name: Kernlogica testen
        run: dotnet test tests/NlcsLegenda.Core.Tests/NlcsLegenda.Core.Tests.csproj -c Release

      - name: Updatecontrole testen
        run: dotnet test tests/NlcsLegenda.Update.Tests -c Release

      - name: Updateprogramma bouwen en ondertekenen
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX_BASE64 -or -not $env:CODESIGN_PFX_PASSWORD) { throw 'Ondertekening ontbreekt.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $pw = ConvertTo-SecureString $env:CODESIGN_PFX_PASSWORD -AsPlainText -Force
          ./dev/scripts/Build-Updater.ps1 -PfxPath $pfx -PfxPassword $pw

      - name: Bundels bouwen en DLL's ondertekenen (2025, 2026 en 2027)
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          $pw = ConvertTo-SecureString $env:CODESIGN_PFX_PASSWORD -AsPlainText -Force
          foreach ($year in 2025, 2026, 2027) {
            ./dev/scripts/Build-Bundle.ps1 -AcadVersion $year -UpdaterPath artifacts/updater/NlcsLegenda.Updater.exe -PfxPath $pfx -PfxPassword $pw
            $directory = "artifacts/release-bundles/$year"
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            Copy-Item -LiteralPath artifacts/NlcsLegenda.bundle -Destination $directory -Recurse
            ./dev/scripts/Test-ReleaseSignatures.ps1 -ContentsDirectory "$directory/NlcsLegenda.bundle/Contents"
            Compress-Archive -LiteralPath "$directory/NlcsLegenda.bundle" -DestinationPath "artifacts/NlcsLegenda-$year-${{ github.ref_name }}.zip"
          }

      - name: MSI-installer bouwen en ondertekenen
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          dotnet tool update --global wix --version 5.0.2 | Out-Null
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = "${{ github.ref_name }}".TrimStart("v")
          # ondertekening verplicht voor publieke releases
          if (-not $env:CODESIGN_PFX_BASE64) { throw "CODESIGN_PFX_BASE64 ontbreekt; een publieke release moet ondertekend worden." }
          if (-not $env:CODESIGN_PFX_PASSWORD) { throw "CODESIGN_PFX_PASSWORD ontbreekt; een publieke release moet ondertekend worden." }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $pw = ConvertTo-SecureString $env:CODESIGN_PFX_PASSWORD -AsPlainText -Force
          ./dev/scripts/Build-Installer.ps1 -Version $version -PfxPath $pfx -PfxPassword $pw -UpdaterPath artifacts/updater/NlcsLegenda.Updater.exe -BundleDirectory artifacts/release-bundles
          Remove-Item $pfx -Force

      - name: Tijdelijke sleutel verwijderen
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }

      - name: Release aanmaken
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version)) " | Select-Object -First 1).LineNumber
          $body = ""
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
            $body = ($section -join "`n").Trim()
          }

          [xml]$definition = Get-Content deploy/installer/Package.wxs -Raw
          $years = ($definition.Wix.Package.Property | Where-Object Id -eq 'NLCSACADYEARS').Value.Split(',') | ForEach-Object { [int]$_ }
          $protocol = [int]($definition.Wix.Package.Property | Where-Object Id -eq 'NLCSUPDATEPROTOCOL').Value
          @{ schema=1; version=$version; autoCadYears=@($years); minimumUpdater=$protocol; installer="NlcsLegenda-$version.msi"; sha256=(Get-FileHash -LiteralPath "artifacts/NlcsLegenda-$version.msi" -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content -LiteralPath artifacts/update.json -Encoding utf8
          Push-Location artifacts
          Get-ChildItem -LiteralPath "NlcsLegenda-2025-${{ github.ref_name }}.zip", "NlcsLegenda-2026-${{ github.ref_name }}.zip", "NlcsLegenda-2027-${{ github.ref_name }}.zip", "NlcsLegenda-$version.msi", "update.json" |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Pop-Location

          $install = "## Installeren`n`nSnelst: download NlcsLegenda-$version.msi en voer die uit. De installer zet de plugin per gebruiker neer (geen beheerder nodig) en werkt voor 2025, 2026 en 2027.`n`nLiever handmatig? Kies de zip voor jouw versie en pak de map NlcsLegenda.bundle uit in %APPDATA%\Autodesk\ApplicationPlugins\.`n`nHerstart daarna Civil 3D of AutoCAD.`n`nDe DLL’s, updater en installer zijn ondertekend met het bestaande codeondertekeningscertificaat van joligej. Die handtekening laat zien dat het bestand na ondertekening niet is gewijzigd; hij zegt niets over een door een externe autoriteit geverifieerde identiteit. Wil je die uitgever vertrouwen, dan importeer je joligej-codesign.cer zelf; let op dat een certificaat in Vertrouwde basiscertificeringsinstanties voor je hele gebruikersprofiel geldt. AutoCAD moet deze uitgever eenmalig vertrouwen om latere updates met hetzelfde certificaat zonder laadvragen te openen. Zie de installatie-uitleg voor de persoonlijke certificaatopslag. De installer en updater wijzigen SECURELOAD, vertrouwde mappen en certificaatopslag niet.`n`nControleer een download met SHA256SUMS.txt."
          Set-Content -Path release-notes.md -Value ($body + "`n`n" + $install) -Encoding UTF8
          gh release create ${{ github.ref_name }} `
            "artifacts/NlcsLegenda-2025-${{ github.ref_name }}.zip" `
            "artifacts/NlcsLegenda-2026-${{ github.ref_name }}.zip" `
            "artifacts/NlcsLegenda-2027-${{ github.ref_name }}.zip" `
            "artifacts/NlcsLegenda-$version.msi" `
            "artifacts/SHA256SUMS.txt" `
            "artifacts/update.json" `
            "deploy/joligej-codesign.cer" `
            --title "NLCS Legenda ${{ github.ref_name }}" `
            --notes-file release-notes.md --draft
          if ($LASTEXITCODE) { throw "Releasebestanden niet volledig geplaatst." }
          gh release edit ${{ github.ref_name }} --draft=false --latest
          if ($LASTEXITCODE) { throw "Release niet gepubliceerd." }
