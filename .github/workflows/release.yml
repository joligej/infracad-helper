name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bundels bouwen en release maken
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Versies en changelog controleren
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $props = ([regex]::Match((Get-Content Directory.Build.props -Raw), '<VersionPrefix>([^<]+)</VersionPrefix>')).Groups[1].Value
          $manifest = ([regex]::Match((Get-Content deploy/NlcsLegenda.bundle/PackageContents.xml -Raw), 'AppVersion="([^"]+)"')).Groups[1].Value
          Write-Host "tag=$tag  props=$props  manifest=$manifest"
          if ($tag -ne $props) { throw "Tag $tag komt niet overeen met Directory.Build.props ($props)." }
          if ($tag -ne $manifest) { throw "Tag $tag komt niet overeen met het bundle-manifest ($manifest)." }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## $tag ")) { throw "Geen CHANGELOG-sectie voor $tag." }

      - name: Kernlogica testen
        run: dotnet test tests/NlcsLegenda.Core.Tests/NlcsLegenda.Core.Tests.csproj -c Release

      - name: Bundels bouwen (2025, 2026 en 2027)
        shell: pwsh
        run: |
          ./dev/scripts/Build-Bundle.ps1 -AcadVersion 2025
          Compress-Archive -Path artifacts/NlcsLegenda.bundle -DestinationPath "artifacts/NlcsLegenda-2025-${{ github.ref_name }}.zip" -Force
          Remove-Item artifacts/NlcsLegenda.bundle -Recurse -Force
          ./dev/scripts/Build-Bundle.ps1 -AcadVersion 2026
          Compress-Archive -Path artifacts/NlcsLegenda.bundle -DestinationPath "artifacts/NlcsLegenda-2026-${{ github.ref_name }}.zip" -Force
          Remove-Item artifacts/NlcsLegenda.bundle -Recurse -Force
          ./dev/scripts/Build-Bundle.ps1 -AcadVersion 2027
          Compress-Archive -Path artifacts/NlcsLegenda.bundle -DestinationPath "artifacts/NlcsLegenda-2027-${{ github.ref_name }}.zip" -Force

      - name: MSI-installer bouwen en ondertekenen
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          dotnet tool update --global wix --version 5.0.2 | Out-Null
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($env:CODESIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            $pw = ConvertTo-SecureString $env:CODESIGN_PFX_PASSWORD -AsPlainText -Force
            ./dev/scripts/Build-Installer.ps1 -Version $version -PfxPath $pfx -PfxPassword $pw
            Remove-Item $pfx -Force
          } else {
            ./dev/scripts/Build-Installer.ps1 -Version $version
          }

      - name: Release aanmaken
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version)) " | Select-Object -First 1).LineNumber
          $body = ""
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
            $body = ($section -join "`n").Trim()
          }

          # SHA-256-checksums van de release-assets, zodat een download te verifiëren is.
          Push-Location artifacts
          Get-ChildItem -File -Include *.zip, *.msi -Recurse |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Pop-Location

          $install = "## Installeren`n`nSnelst: download NlcsLegenda-$version.msi en voer die uit. De installer zet de plugin per gebruiker neer (geen beheerder nodig) en werkt voor 2025, 2026 en 2027.`n`nLiever handmatig? Kies de zip voor jouw versie en pak de map NlcsLegenda.bundle uit in %APPDATA%\Autodesk\ApplicationPlugins\.`n`nHerstart daarna Civil 3D of AutoCAD.`n`nDe installer is self-signed ondertekend als joligej. Die handtekening laat zien dat het bestand na ondertekening niet is gewijzigd; hij zegt niets over een door een externe autoriteit geverifieerde identiteit. Wil je die uitgever vertrouwen, dan importeer je joligej-codesign.cer zelf; let op dat een certificaat in Vertrouwde basiscertificeringsinstanties voor je hele gebruikersprofiel geldt. Zonder import werkt de installer gewoon, maar toont Windows onbekende uitgever.`n`nControleer een download met SHA256SUMS.txt."
          Set-Content -Path release-notes.md -Value ($body + "`n`n" + $install) -Encoding UTF8
          gh release create ${{ github.ref_name }} `
            "artifacts/NlcsLegenda-2025-${{ github.ref_name }}.zip" `
            "artifacts/NlcsLegenda-2026-${{ github.ref_name }}.zip" `
            "artifacts/NlcsLegenda-2027-${{ github.ref_name }}.zip" `
            "artifacts/NlcsLegenda-$version.msi" `
            "artifacts/SHA256SUMS.txt" `
            "deploy/joligej-codesign.cer" `
            --title "NLCS Legenda ${{ github.ref_name }}" `
            --notes-file release-notes.md
